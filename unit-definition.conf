[Unit]
Description=corymassaro.com website

[Service]
ExecStart=/home/cory/oracle/venv/bin/uwsgi --socket 0.0.0.0:5000 --protocol=http --wsgi-file wsgi.py --callable the_app
WorkingDirectory=/home/cory/oracle
LimitNOFILE=4096
IgnoreSIGPIPE=false
KillMode=process
User=cory

[Install]
WantedBy=multi-user.target

# /etc/systemd/system/oracle.service
